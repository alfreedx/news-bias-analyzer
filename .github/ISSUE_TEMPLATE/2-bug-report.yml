name: Error
description: Algo no funciona como debería.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: Qué ha pasado
      description: Describe el error y qué esperabas que ocurriera.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Pasos para reproducirlo
      placeholder: |
        1. Buscar «…»
        2. Pulsar en …
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: Navegador / sistema
