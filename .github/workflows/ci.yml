name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check app tests scripts
      - run: python -m pytest -q
      - name: Audit dependencies for known vulnerabilities
        run: pip-audit -r requirements.txt

  e2e:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: python -m playwright install --with-deps chromium
      - run: python -m pytest -m e2e -q

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Build image
        run: docker build -t contraste:ci .
      - name: Run container (read-only, unprivileged)
        run: |
          docker run -d --name contraste -p 8000:8000 --read-only --tmpfs /tmp -e INGEST_ENABLED=false contraste:ci
      - name: Smoke test
        run: |
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8000/api/salud && break
            sleep 1
          done
          curl -fsS http://127.0.0.1:8000/ -o /dev/null
          curl -fsS http://127.0.0.1:8000/medios -o /dev/null
          curl -fsS -D - -o /dev/null http://127.0.0.1:8000/ | grep -i "content-security-policy: default-src 'none'"
          test "$(docker inspect -f '{{.Config.User}}' contraste)" = "contraste"
      - name: Container logs
        if: failure()
        run: docker logs contraste

  snapshot:
    # Refreshes the encrypted data snapshot right before a deploy, so the new instance restores fresh history.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test
    permissions:
      contents: write
    uses: ./.github/workflows/data-snapshot.yml
    secrets: inherit

  deploy:
    # Triggers the Render deploy only after every check passed on main.
    # The hook URL is a secret (Render → service → Settings → Deploy Hook).
    # A failed snapshot refresh does not block the deploy: the new instance restores the previous one.
    if: >-
      always() && github.event_name == 'push' && github.ref == 'refs/heads/main' &&
      needs.test.result == 'success' && needs.e2e.result == 'success' && needs.docker.result == 'success'
    needs: [test, e2e, docker, snapshot]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Trigger Render deploy
        env:
          HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: |
          if [ -z "$HOOK" ]; then echo "RENDER_DEPLOY_HOOK not set; skipping"; exit 0; fi
          curl -fsS -X POST --max-time 60 -o /dev/null "$HOOK" && echo "Deploy requested"
