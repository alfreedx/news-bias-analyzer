name: Discover media

# Weekly search for Spanish outlets that are not in the catalog yet (docs/PLAN-COBERTURA.md, Fase 1).
# It NEVER edits data/media.json: it writes data/candidates.json (full report) and data/media.candidates.json
# (ready-to-merge entries of the candidates that pass the inclusion gate) and opens or updates ONE pull request
# on the branch bot/media-candidates. A human reviews it; chosen outlets are merged with
# `python scripts/discover_media.py --apply ID [ID ...]` (see CONTRIBUTING.md, "Altas automáticas de medios").
#
# The pull request is created with the GitHub CLI and the workflow's own GITHUB_TOKEN (no third-party action).
# Repository setting needed once: Settings > Actions > General > "Allow GitHub Actions to create and approve
# pull requests".
on:
  schedule:
    - cron: "23 5 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: discover-media
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
      BRANCH: bot/media-candidates
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt
      - name: Discover candidates
        run: python scripts/discover_media.py
      - name: Did the list of ready-to-merge candidates change?
        id: diff
        run: |
          if [ -n "$(git status --porcelain -- data/media.candidates.json)" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No change in data/media.candidates.json: no pull request needed."
          fi
      - name: Write the pull request body
        if: steps.diff.outputs.changed == 'true'
        run: python scripts/discover_media.py --pr-body > "$RUNNER_TEMP/pr-body.md"
      - name: Push the branch and open or update the pull request
        if: steps.diff.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$BRANCH"
          git add data/media.candidates.json data/candidates.json
          git commit -m "Candidatos a medio (descubrimiento automático)"
          git push --force origin "$BRANCH"
          number="$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number // empty')"
          if [ -n "$number" ]; then
            gh pr edit "$number" --body-file "$RUNNER_TEMP/pr-body.md"
            echo "Updated pull request #$number"
          else
            gh pr create --base "${{ github.event.repository.default_branch }}" --head "$BRANCH" \
              --title "Candidatos a medio (descubrimiento automático)" --body-file "$RUNNER_TEMP/pr-body.md"
          fi
